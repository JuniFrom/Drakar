<!doctype html><html lang='sv'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'><title>Golden Dragon</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#08131b;font-family:system-ui;color:white}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:fixed;left:12px;top:10px;text-shadow:0 2px 3px #000;font-weight:700}.tip{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#0008;padding:8px 12px;border-radius:14px;font-size:13px}.magic{position:fixed;right:18px;bottom:24px;width:78px;height:78px;border-radius:50%;border:2px solid #fff9;background:#ffd84dcc;color:#402d00;font-size:30px;box-shadow:0 0 25px #fff7;touch-action:none}.title{position:fixed;top:10px;left:50%;transform:translateX(-50%);letter-spacing:.18em;color:#ffe991;text-shadow:0 2px 8px #000}</style></head><body><canvas id='c'></canvas><div class='title'>GOLDEN DRAGON</div><div class='hud' id='hud'></div><button class='magic' id='magic'>✦</button><div class='tip' id='tip'>Tryck på marken för att flyga • ✦ skjuter ljus</div><script>
const c=document.querySelector('#c'),x=c.getContext('2d'),hud=document.querySelector('#hud'),tip=document.querySelector('#tip');let W,H,dpr;function resize(){dpr=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const p={x:W*.25,y:H*.55,tx:W*.25,ty:H*.55,hp:5,xp:0,lvl:1};let shots=[], enemies=[], particles=[],boss=null,egg=null,won=false,t=0;
function spawn(){for(let i=0;i<5;i++)enemies.push({x:W*(.48+Math.random()*.42),y:H*(.18+Math.random()*.64),hp:2,cd:Math.random()*2,a:Math.random()*6.28})}spawn();
function target(e){if(e.target.closest?.('.magic'))return;let r=c.getBoundingClientRect();p.tx=e.clientX-r.left;p.ty=e.clientY-r.top}c.addEventListener('pointerdown',target);
function fire(){if(won)return;let list=boss?[boss]:enemies;if(!list.length)return;let q=list.reduce((a,b)=>Math.hypot(b.x-p.x,b.y-p.y)<Math.hypot(a.x-p.x,a.y-p.y)?b:a,list[0]),a=Math.atan2(q.y-p.y,q.x-p.x);shots.push({x:p.x,y:p.y,vx:Math.cos(a)*520,vy:Math.sin(a)*520})}document.querySelector('#magic').addEventListener('pointerdown',e=>{e.preventDefault();fire()});
function burst(X,Y){for(let i=0;i<12;i++)particles.push({x:X,y:Y,vx:(Math.random()-.5)*180,vy:(Math.random()-.5)*180,l:1})}
function levelXP(){return 3+p.lvl*2}function gain(){p.xp++;if(p.xp>=levelXP()){p.xp=0;p.lvl++;tip.textContent='LEVEL '+p.lvl+'! Din ljusmagi blir starkare ✨';setTimeout(()=>tip.textContent='Hitta det stulna drakägget!',1800)}}
function update(dt){t+=dt;let dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);if(d>5){let s=190+12*p.lvl;p.x+=dx/d*s*dt;p.y+=dy/d*s*dt}for(let s of shots){s.x+=s.vx*dt;s.y+=s.vy*dt}shots=shots.filter(s=>s.x>-30&&s.x<W+30&&s.y>-30&&s.y<H+30);
 for(let e of enemies){let a=Math.atan2(p.y-e.y,p.x-e.x);e.x+=Math.cos(a)*42*dt;e.y+=Math.sin(a)*42*dt;e.a=a;if(Math.hypot(e.x-p.x,e.y-p.y)<32){e.x-=Math.cos(a)*55;e.y-=Math.sin(a)*55}}
 for(let s of shots)for(let e of enemies)if(e.hp>0&&Math.hypot(s.x-e.x,s.y-e.y)<25){e.hp-=1+p.lvl*.12;s.x=-999;burst(e.x,e.y)}let dead=enemies.filter(e=>e.hp<=0);dead.forEach(gain);enemies=enemies.filter(e=>e.hp>0);if(!enemies.length&&!boss&&!egg){boss={x:W*.76,y:H*.48,hp:12,max:12,tele:1.5};tip.textContent='SKUGGDRAKEN! Den kan teleportera sig.'}
 if(boss){boss.tele-=dt;if(boss.tele<0){boss.x=W*(.45+Math.random()*.45);boss.y=H*(.2+Math.random()*.6);boss.tele=1.5;burst(boss.x,boss.y)}for(let s of shots)if(Math.hypot(s.x-boss.x,s.y-boss.y)<40){boss.hp-=1+p.lvl*.12;s.x=-999;burst(boss.x,boss.y)}if(boss.hp<=0){burst(boss.x,boss.y);boss=null;egg={x:W*.72,y:H*.5,hatch:0};tip.textContent='Du hittade ägget! Flyg fram till det.'}}
 if(egg&&Math.hypot(p.x-egg.x,p.y-egg.y)<45){egg.hatch+=dt;if(egg.hatch>1.3&&!won){won=true;tip.textContent='🐣 ÄGGET KLÄCKTES! DU VANN GOLDEN DRAGON!'}}particles.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt*1.6});particles=particles.filter(q=>q.l>0)}
function dragon(X,Y,scale=1,dark=false,baby=false){x.save();x.translate(X,Y);x.scale(scale,scale);x.shadowBlur=dark?12:22;x.shadowColor=dark?'#8d45ff':'#ffe65b';x.fillStyle=dark?'#1c1530':'#e8b927';x.beginPath();x.ellipse(0,0,baby?14:22,baby?9:13,0,0,7);x.fill();x.beginPath();x.moveTo(-8,-3);x.lineTo(-32,-22);x.lineTo(-22,2);x.moveTo(-8,3);x.lineTo(-32,22);x.lineTo(-20,-1);x.fill();x.beginPath();x.moveTo(18,0);x.lineTo(34,-7);x.lineTo(31,7);x.fill();x.fillStyle=dark?'#a967ff':'#fff6a5';x.beginPath();x.arc(21,-4,2.5,0,7);x.arc(21,4,2.5,0,7);x.fill();x.restore()}
function draw(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#183a3d');g.addColorStop(1,'#07191d');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#35544b';for(let i=0;i<18;i++){let X=(i*173)%W,Y=(i*97)%H;x.beginPath();x.arc(X,Y,24+(i%4)*8,0,7);x.fill()}x.strokeStyle='#597263';x.lineWidth=5;x.beginPath();x.moveTo(0,H*.72);x.bezierCurveTo(W*.3,H*.58,W*.58,H*.85,W,H*.62);x.stroke();dragon(p.x,p.y,1,false);for(let e of enemies)dragon(e.x,e.y,.8,true);if(boss){dragon(boss.x,boss.y,1.55,true);x.fillStyle='#0009';x.fillRect(W*.25,48,W*.5,12);x.fillStyle='#b15cff';x.fillRect(W*.25,48,W*.5*(boss.hp/boss.max),12)}for(let s of shots){x.shadowBlur=20;x.shadowColor='#fff';x.fillStyle='#fff9a8';x.beginPath();x.arc(s.x,s.y,7,0,7);x.fill();x.shadowBlur=0}for(let q of particles){x.globalAlpha=q.l;x.fillStyle='#ffe75d';x.beginPath();x.arc(q.x,q.y,4,0,7);x.fill()}x.globalAlpha=1;if(egg){x.fillStyle='#f5e8c7';x.beginPath();x.ellipse(egg.x,egg.y,18,25,0,0,7);x.fill();x.strokeStyle='#d5b05b';x.stroke();if(won)dragon(egg.x+5,egg.y-8,.65,false,true)}hud.innerHTML=`❤️ ${p.hp}/5 &nbsp; ⭐ Level ${p.lvl}<br>XP ${p.xp}/${levelXP()} &nbsp; 🐲 ${enemies.length+(boss?1:0)}`}
let last=performance.now();function loop(n){let dt=Math.min((n-last)/1000,.033);last=n;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
